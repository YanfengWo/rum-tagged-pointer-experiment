[workspace]
resolver = "3"
members = [
    "crates/rum-cli",
    "crates/rum-core",
    "crates/rum-difftest",
    "crates/rum-host",
    "crates/rum-jupyter",
    "crates/rum-repl",
    "crates/rum-runtime",
    "crates/rum-stdlib",
    "crates/rum-syntax",
    "crates/rum-terminal",
]
default-members = ["crates/rum-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
