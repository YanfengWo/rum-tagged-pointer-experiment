[package]
name = "rum-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line entry point for rum."

[features]
# Layer B B0 measurement scaffold: wrap mimalloc in a counting allocator.
# Off by default so the production build is bare mimalloc with zero per-alloc cost.
alloc-count = []

[dependencies]
mimalloc = "0.1.52"
rum-repl = { path = "../rum-repl" }
rum-host = { path = "../rum-host" }
rum-runtime = { path = "../rum-runtime" }
rum-stdlib = { path = "../rum-stdlib" }
rum-syntax = { path = "../rum-syntax" }
rum-terminal = { path = "../rum-terminal" }
