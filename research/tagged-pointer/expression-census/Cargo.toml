[package]
name = "rum-expression-census"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
rum-core = { path = "../../../crates/rum-core" }
rum-runtime = { path = "../../../crates/rum-runtime" }
rum-stdlib = { path = "../../../crates/rum-stdlib", default-features = false }
rum-syntax = { path = "../../../crates/rum-syntax" }
rum-recursive-expr = { path = "../recursive-expr" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.149"

[features]
allocation-count = []
